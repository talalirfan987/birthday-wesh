<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<title>Talal Sardar · 5 November</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,700&family=Poppins:wght@300;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #fdf6ff;
    --ink-soft: rgba(253, 246, 255, 0.72);
    --gold: #ffd27a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #07040f; color: var(--ink); }
  body { font-family: 'Poppins', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

  /* Two background moods cross-fade: warm (birthday) and sad (lost love) */
  .bg { position: fixed; inset: 0; transition: opacity 3s ease; }
  #bg-warm { background: radial-gradient(120% 80% at 50% 30%, #2a0f3d 0%, #13071f 55%, #07040f 100%); }
  #bg-sad  { background: radial-gradient(120% 80% at 50% 20%, #0c1a2e 0%, #070d18 55%, #030509 100%); opacity: 0; }
  body.sad #bg-sad { opacity: 1; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%); }

  /* Captions */
  #caption { position: fixed; left: 0; right: 0; bottom: max(9vh, 56px); padding: 0 24px;
    text-align: center; pointer-events: none; }
  #caption .main { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700;
    font-size: clamp(26px, 7.2vw, 54px); line-height: 1.15; max-width: 760px; margin: 0 auto;
    text-shadow: 0 0 24px rgba(255, 140, 200, 0.45), 0 2px 10px rgba(0,0,0,0.6); }
  body.sad #caption .main { text-shadow: 0 0 24px rgba(120, 170, 255, 0.45), 0 2px 10px rgba(0,0,0,0.6); }
  #caption .sub { margin-top: 12px; font-weight: 300; letter-spacing: 0.08em;
    font-size: clamp(14px, 3.8vw, 22px); color: var(--ink-soft); }
  #caption .main, #caption .sub { opacity: 0; transform: translateY(16px) scale(0.98); filter: blur(10px);
    transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1), filter 1.1s ease; }
  #caption .sub { transition-delay: 0.35s; }
  #caption.show .main, #caption.show .sub { opacity: 1; transform: none; filter: none; }

  /* Intro / tap-to-play */
  #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: rgba(5, 2, 10, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    transition: opacity 1.2s ease; text-align: center; padding: 24px; z-index: 5; }
  #intro.hide { opacity: 0; pointer-events: none; }
  #intro .date { font-weight: 300; letter-spacing: 0.5em; color: var(--gold); font-size: 14px; }
  #intro h1 { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(34px, 10vw, 64px); }
  #intro p { color: var(--ink-soft); font-weight: 300; font-size: 15px; }
  #play { margin-top: 10px; border: 1px solid rgba(255,210,122,0.6); background: rgba(255,210,122,0.12);
    color: var(--ink); font: 500 16px 'Poppins', sans-serif; letter-spacing: 0.1em; padding: 14px 34px;
    border-radius: 999px; cursor: pointer; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,210,122,0.35); } 50% { box-shadow: 0 0 0 14px rgba(255,210,122,0); } }

  /* Controls auto-hide so screen recordings stay clean */
  #controls { position: fixed; top: max(16px, env(safe-area-inset-top)); right: 16px; display: flex; gap: 10px;
    z-index: 4; transition: opacity 0.6s ease; }
  #controls.idle { opacity: 0; pointer-events: none; }
  #controls button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); color: #fff; font-size: 17px; cursor: pointer; }
</style>
</head>
<body>
<div id="bg-warm" class="bg"></div>
<div id="bg-sad" class="bg"></div>
<canvas id="scene"></canvas>
<div class="vignette"></div>

<div id="caption"><div class="main"></div><div class="sub"></div></div>

<div id="intro">
  <div class="date">05 · 11</div>
  <h1>Talal Sardar</h1>
  <p>ek chhota sa status… dil se 🤍</p>
  <button id="play" type="button">▶ PLAY</button>
</div>

<div id="controls" class="idle">
  <button id="btn-sound" type="button" title="Sound on/off">🔊</button>
  <button id="btn-restart" type="button" title="Restart">↻</button>
  <button id="btn-full" type="button" title="Fullscreen">⛶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------
 * STORY TIMELINE — edit captions / durations here.
 * mode:  galaxy | shape | break | rain | field
 * ------------------------------------------------------------------ */
const GOLD = ['#ffd27a', '#ffb347', '#fff3c4', '#ff9ec7'];
const SCENES = [
  { mode: 'galaxy', dur: 5,   orbit: 1.0, cap: ['5 November', 'aaj ka din kuch khaas hai 🌙'] },
  { mode: 'shape', shape: 'nov',   dur: 5,   orbit: 0.35, pal: GOLD, burst: 6,
    cap: ['Aaj mera birthday hai 🎂', 'saal ka sab se khaas din'] },
  { mode: 'shape', shape: 'talal', dur: 5.5, orbit: 0.35, pal: ['#ff7eb6', '#ffd27a', '#ffffff', '#c084fc'], burst: 9,
    cap: ['Happy Birthday', 'Talal Sardar ✨'] },
  { mode: 'shape', shape: 'kaluu', dur: 2.6, orbit: 0.3, pal: ['#a78bfa', '#f0abfc', '#ffffff'], burst: 7,
    cap: ['Kaluu · Shanu · Shan Sardar', 'naam bohot saare… dil sirf ek 🤍'] },
  { mode: 'shape', shape: 'shanu', dur: 2.6, orbit: 0.3, pal: ['#f472b6', '#fbcfe8', '#ffffff'], burst: 7 },
  { mode: 'shape', shape: 'shan',  dur: 3,   orbit: 0.3, pal: ['#ffd27a', '#fde68a', '#ffffff'], burst: 7 },
  { mode: 'shape', shape: 'cake',  dur: 5,   orbit: 0.6, burst: 8, colored: true,
    cap: ['Ek saal aur…', 'aur ek dua aur 🕯️'] },
  { mode: 'shape', shape: 'heart', dur: 5,   orbit: 0.6, pal: ['#ff2d55', '#ff5c7a', '#ff9aa9', '#c9184a'], burst: 5, beat: true,
    cap: ['Har khushi mukammal hai…', 'bas ek shakhs ki kami hai 🥀'] },
  { mode: 'break', dur: 3.2, orbit: 0.5, pal: ['#a4133c', '#c9184a', '#ff4d6d'], sad: true,
    cap: ['Jisay apni zindagi samjha tha…', 'usi ko haar baitha 💔'] },
  { mode: 'rain', dur: 6.5, orbit: 0.4, pal: ['#7fa7d9', '#b8d0ef', '#ffffff', '#5b7fb5'], sad: true,
    cap: ['Mohabbat sacchi thi', 'bas qismat mein na thi 🌧️'] },
  { mode: 'field', dur: 6, orbit: 0.9, pal: ['#ffffff', '#ffe8b0', '#c7d7ff'], sad: true,
    cap: ['Woh jahan bhi rahe, khush rahe', 'meri har dua mein aaj bhi woh hai 🤲'] },
  { mode: 'shape', shape: 'final', dur: 8, orbit: 0.35, pal: ['#ffd27a', '#ffffff', '#ff9ec7', '#ffe8b0'], burst: 10,
    cap: ['Happy Birthday to me 🎂', '— Talal Sardar · 05.11 🖤'] },
];

/* ------------------------------------------------------------------ renderer */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
camera.position.set(0, 0, 30);

const view = { w: 0, h: 0 }; // visible world size at z = 0
const isSmall = Math.min(window.innerWidth, window.innerHeight) < 700;
const N = isSmall ? 6000 : 9000;

const VERT = `
  attribute float aSize; attribute vec3 aColor; attribute float aSeed;
  uniform float uTime, uScale, uSizeMul, uWobble, uTwinkle;
  varying vec3 vColor; varying float vAlpha;
  void main() {
    vec3 p = position;
    p += vec3(sin(uTime * 1.3 + aSeed * 40.0), cos(uTime * 1.1 + aSeed * 23.0), sin(uTime * 0.9 + aSeed * 11.0)) * uWobble;
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    float tw = 1.0 - uTwinkle * 0.6 * (0.5 + 0.5 * sin(uTime * 3.0 + aSeed * 60.0));
    gl_PointSize = aSize * uSizeMul * uScale / -mv.z;
    gl_Position = projectionMatrix * mv;
    vColor = aColor; vAlpha = tw;
  }`;
const FRAG = `
  uniform float uOpacity;
  varying vec3 vColor; varying float vAlpha;
  void main() {
    float d = length(gl_PointCoord - 0.5);
    float a = smoothstep(0.5, 0.0, d);
    a = a * a * uOpacity * vAlpha;
    gl_FragColor = vec4(vColor * a, a);
  }`;

function makeMaterial(opacity) {
  return new THREE.ShaderMaterial({
    vertexShader: VERT, fragmentShader: FRAG,
    uniforms: { uTime: { value: 0 }, uScale: { value: 1 }, uSizeMul: { value: 1 },
                uWobble: { value: 0.05 }, uTwinkle: { value: 0 }, uOpacity: { value: opacity } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
}

/* Main morphing particle cloud */
const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
const tPos = new Float32Array(N * 3), tCol = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const size = new Float32Array(N), seed = new Float32Array(N), spd = new Float32Array(N);
const gA = new Float32Array(N), gR = new Float32Array(N), gY = new Float32Array(N); // galaxy polar coords
const fallV = new Float32Array(N), fallMax = new Float32Array(N), fallWait = new Float32Array(N);
for (let i = 0; i < N; i++) {
  size[i] = 0.12 + Math.random() * 0.22;
  seed[i] = Math.random();
  spd[i] = 1.6 + Math.random() * 2.6;
  pos[i * 3] = (Math.random() - 0.5) * 60; pos[i * 3 + 1] = (Math.random() - 0.5) * 60; pos[i * 3 + 2] = (Math.random() - 0.5) * 60;
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
const mat = makeMaterial(0.62);
const cloud = new THREE.Points(geo, mat);
cloud.frustumCulled = false;
scene.add(cloud);

/* Distant background star field */
const S = 1400;
const sPos = new Float32Array(S * 3), sCol = new Float32Array(S * 3), sSize = new Float32Array(S), sSeed = new Float32Array(S);
for (let i = 0; i < S; i++) {
  sPos[i * 3] = (Math.random() - 0.5) * 160; sPos[i * 3 + 1] = (Math.random() - 0.5) * 160; sPos[i * 3 + 2] = -30 - Math.random() * 60;
  const c = 0.6 + Math.random() * 0.4; sCol[i * 3] = c; sCol[i * 3 + 1] = c; sCol[i * 3 + 2] = c + 0.1;
  sSize[i] = 0.2 + Math.random() * 0.5; sSeed[i] = Math.random();
}
const sGeo = new THREE.BufferGeometry();
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
sGeo.setAttribute('aColor', new THREE.BufferAttribute(sCol, 3));
sGeo.setAttribute('aSize', new THREE.BufferAttribute(sSize, 1));
sGeo.setAttribute('aSeed', new THREE.BufferAttribute(sSeed, 1));
const sMat = makeMaterial(0.8);
sMat.uniforms.uTwinkle.value = 1; sMat.uniforms.uWobble.value = 0;
const stars = new THREE.Points(sGeo, sMat);
scene.add(stars);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  view.h = 2 * camera.position.length() * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  view.w = view.h * camera.aspect;
  const scale = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  mat.uniforms.uScale.value = scale; sMat.uniforms.uScale.value = scale;
}

/* ------------------------------------------------------------------ shapes */
// Rasterise to an offscreen canvas and keep every 3rd opaque pixel as a point.
function fromCanvas(g, w, h, step, colored) {
  const d = g.getImageData(0, 0, w, h).data;
  const pts = []; let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) {
    const k = (y * w + x) * 4;
    if (d[k + 3] < 128) continue;
    const p = { x, y: -y, z: 0 };
    if (colored) p.c = [d[k] / 255, d[k + 1] / 255, d[k + 2] / 255];
    pts.push(p);
    if (x < minX) minX = x; if (x > maxX) maxX = x; if (-y < minY) minY = -y; if (-y > maxY) maxY = -y;
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  pts.forEach(p => { p.x -= cx; p.y -= cy; });
  return { pts, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY), step, colored, depth: 1.4 };
}
function textShape(text) {
  const lines = text.split('\n'), fs = 220, lh = fs * 1.02;
  const c = document.createElement('canvas'), g = c.getContext('2d', { willReadFrequently: true });
  const font = `800 ${fs}px Poppins, "Arial Black", sans-serif`;
  g.font = font;
  c.width = Math.ceil(Math.max(...lines.map(l => g.measureText(l).width))) + 40;
  c.height = Math.ceil(lh * lines.length) + 40;
  g.font = font; g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((l, i) => g.fillText(l, c.width / 2, 20 + lh * (i + 0.5)));
  return fromCanvas(g, c.width, c.height, 3, false);
}
function emojiShape(emoji) {
  const c = document.createElement('canvas'); c.width = c.height = 460;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.font = '380px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(emoji, 230, 250);
  const s = fromCanvas(g, 460, 460, 3, true);
  s.depth = 3;
  return s.pts.length > 300 ? s : null; // emoji font missing → caller falls back
}
// Puffy 3D heart from the classic parametric curve.
function heartShape(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = Math.random() * Math.PI * 2;
    const edge = Math.random() < 0.35;
    const k = edge ? 0.94 + Math.random() * 0.06 : Math.sqrt(Math.random());
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pts.push({ x: x * k, y: y * k + 2.5, z: (Math.random() - 0.5) * 12 * Math.sqrt(Math.max(0, 1 - k * k)) });
  }
  return { pts, w: 32, h: 29, step: 0.4, depth: 0 };
}

let shapes = null;
function buildShapes() {
  shapes = {
    nov: textShape('5 NOV'),
    talal: textShape('TALAL'),
    kaluu: textShape('KALUU'),
    shanu: textShape('SHANU'),
    shan: textShape('SHAN\nSARDAR'),
    final: textShape('TALAL\nSARDAR'),
    heart: heartShape(N),
  };
  shapes.cake = emojiShape('🎂') || shapes.heart;
}

/* ------------------------------------------------------------------ scene logic */
const tmpC = new THREE.Color();
function pickColor(pal, out, i) {
  tmpC.set(pal[Math.floor(Math.random() * pal.length)]);
  const v = 0.75 + Math.random() * 0.35;
  out[i * 3] = tmpC.r * v; out[i * 3 + 1] = tmpC.g * v; out[i * 3 + 2] = tmpC.b * v;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const shapeLift = () => view.h * 0.09; // keep shapes above the caption area

let mode = 'galaxy', current = 0, sceneT = 0, playing = false;

function applyScene(idx, isResize) {
  const s = SCENES[idx];
  current = idx; mode = s.mode;
  document.body.classList.toggle('sad', !!s.sad);
  Music.setMood(!!s.sad);
  mat.uniforms.uTwinkle.value = s.mode === 'field' ? 1 : 0;

  if (s.mode === 'galaxy') {
    const R = Math.min(view.w, view.h) * 0.48;
    const pal = ['#fff3c4', '#ffb347', '#ff7eb6', '#c084fc', '#8b5cf6'];
    for (let i = 0; i < N; i++) {
      const r = Math.pow(Math.random(), 0.7) * R, f = r / R;
      gR[i] = r; gY[i] = (Math.random() - 0.5) * R * 0.12 * (1 - f);
      gA[i] = (i % 3) * (Math.PI * 2 / 3) + f * 3.4 + (Math.random() - 0.5) * 0.7;
      tmpC.set(pal[Math.min(pal.length - 1, Math.floor(f * pal.length + Math.random() * 0.8))]);
      tCol[i * 3] = tmpC.r; tCol[i * 3 + 1] = tmpC.g; tCol[i * 3 + 2] = tmpC.b;
    }
  } else if (s.mode === 'shape') {
    const sh = shapes[s.shape];
    const scale = Math.min((view.w * 0.86) / sh.w, (view.h * (s.shape === 'heart' || s.shape === 'cake' ? 0.42 : 0.34)) / sh.h);
    const list = shuffle(sh.pts.slice());
    const jit = sh.step * scale * 0.9, lift = shapeLift();
    for (let i = 0; i < N; i++) {
      const p = list[i % list.length], k = i * 3;
      tPos[k] = p.x * scale + (Math.random() - 0.5) * jit;
      tPos[k + 1] = p.y * scale + lift + (Math.random() - 0.5) * jit;
      tPos[k + 2] = p.z * scale + (Math.random() - 0.5) * sh.depth;
      if (sh.colored && p.c) {
        tCol[k] = Math.min(1, p.c[0] * 1.25 + 0.08); tCol[k + 1] = Math.min(1, p.c[1] * 1.25 + 0.08); tCol[k + 2] = Math.min(1, p.c[2] * 1.25 + 0.08);
      } else pickColor(s.pal || GOLD, tCol, i);
    }
  } else if (s.mode === 'break') {
    // Split the current heart along a zig-zag crack; each half tilts away.
    const lift = shapeLift(), pivotY = lift - view.h * 0.2, gap = view.w * 0.07;
    for (let i = 0; i < N; i++) {
      const k = i * 3, x = tPos[k], y = tPos[k + 1];
      const crack = Math.sin((y - lift) * 1.6) * view.w * 0.02;
      const side = x > crack ? 1 : -1, ang = side * -0.32;
      const dx = x, dy = y - pivotY;
      tPos[k] = dx * Math.cos(ang) - dy * Math.sin(ang) + side * gap;
      tPos[k + 1] = dx * Math.sin(ang) + dy * Math.cos(ang) + pivotY - view.h * 0.02;
      pickColor(s.pal, tCol, i);
    }
  } else if (s.mode === 'rain') {
    for (let i = 0; i < N; i++) {
      fallV[i] = 0; fallMax[i] = 3 + Math.random() * 9; fallWait[i] = Math.random() * 1.6;
      pickColor(s.pal, tCol, i);
    }
  } else if (s.mode === 'field') {
    for (let i = 0; i < N; i++) {
      const k = i * 3;
      tPos[k] = (Math.random() - 0.5) * view.w * 1.3;
      tPos[k + 1] = (Math.random() - 0.5) * view.h * 1.2;
      tPos[k + 2] = -18 + Math.random() * 22;
      pickColor(s.pal, tCol, i);
    }
  }

  if (!isResize) {
    if (s.burst) for (let i = 0; i < N * 3; i++) vel[i] += (Math.random() - 0.5) * s.burst * 2;
    if (s.cap) setCaption(s.cap);
  }
}

/* ------------------------------------------------------------------ captions */
const capEl = document.getElementById('caption');
const capMain = capEl.querySelector('.main'), capSub = capEl.querySelector('.sub');
let capTimer = 0;
function setCaption([main, sub]) {
  capEl.classList.remove('show');
  clearTimeout(capTimer);
  capTimer = setTimeout(() => {
    capMain.textContent = main; capSub.textContent = sub || '';
    capEl.classList.add('show');
  }, 650);
}

/* ------------------------------------------------------------------ music (WebAudio, no files) */
const Music = (() => {
  let ctx = null, master, filter, timer, next = 0, step = 0, muted = false;
  const BPM = 72, E = 60 / BPM / 2;
  const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am F C G
  const PAT = [0, 1, 2, 3, 2, 1, 2, 1];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function note(t, m, vol, dur, type) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(filter);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function tick() {
    while (next < ctx.currentTime + 0.25) {
      const bar = Math.floor(step / 8) % PROG.length, ch = PROG[bar], idx = PAT[step % 8];
      const m = idx === 3 ? ch[0] + 12 : ch[idx];
      note(next, m + 12, 0.11, 1.6, 'triangle');
      note(next, m + 24, 0.025, 1.0, 'sine');
      if (step % 8 === 0) note(next, ch[0] - 12, 0.16, E * 8, 'sine');
      next += E; step++;
    }
  }
  return {
    start() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = muted ? 0 : 0.5;
        filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 2600;
        const delay = ctx.createDelay(), fb = ctx.createGain(), wet = ctx.createGain();
        delay.delayTime.value = E * 3; fb.gain.value = 0.32; wet.gain.value = 0.3;
        filter.connect(master); filter.connect(delay); delay.connect(fb).connect(delay); delay.connect(wet).connect(master);
        master.connect(ctx.destination);
      }
      ctx.resume();
      next = ctx.currentTime + 0.1; step = 0;
      clearInterval(timer); timer = setInterval(tick, 60);
    },
    setMood(sad) { if (ctx) filter.frequency.setTargetAtTime(sad ? 850 : 2600, ctx.currentTime, 1.2); },
    toggle() { muted = !muted; if (ctx) master.gain.setTargetAtTime(muted ? 0 : 0.5, ctx.currentTime, 0.1); return !muted; },
  };
})();

/* ------------------------------------------------------------------ main loop */
const clock = new THREE.Clock();
let t = 0, orbit = 1, beat = 1;

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  const s = SCENES[current];

  if (playing) {
    sceneT += dt;
    if (sceneT >= s.dur) { sceneT = 0; applyScene((current + 1) % SCENES.length); }
  }

  if (mode === 'galaxy') {
    const tilt = 1.05, ct = Math.cos(tilt), st = Math.sin(tilt), R = Math.min(view.w, view.h) * 0.48, lift = shapeLift() * 0.6;
    for (let i = 0; i < N; i++) {
      gA[i] += dt * 0.45 * (1.25 - gR[i] / R);
      const x = Math.cos(gA[i]) * gR[i], z = Math.sin(gA[i]) * gR[i], y = gY[i];
      tPos[i * 3] = x; tPos[i * 3 + 1] = y * ct - z * st + lift; tPos[i * 3 + 2] = y * st + z * ct;
    }
  }

  if (mode === 'rain') {
    // Heart crumbles: each particle waits, then falls like a tear; wraps to the top.
    const bottom = -view.h * 0.62, top = view.h * 0.62;
    for (let i = 0; i < N; i++) {
      const k = i * 3;
      if (fallWait[i] > 0) { fallWait[i] -= dt; continue; }
      fallV[i] = Math.min(fallV[i] + 7 * dt, fallMax[i]);
      pos[k + 1] -= fallV[i] * dt;
      pos[k] += Math.sin(t * 0.7 + seed[i] * 20) * 0.15 * dt;
      if (pos[k + 1] < bottom) {
        pos[k + 1] = top; pos[k] = (Math.random() - 0.5) * view.w * 1.2; pos[k + 2] = (Math.random() - 0.5) * 14;
        fallV[i] = fallMax[i] * 0.6;
      }
      vel[k] = vel[k + 1] = vel[k + 2] = 0;
    }
  } else {
    if (mode === 'field') {
      const top = view.h * 0.6;
      for (let i = 0; i < N; i++) { // prayers drifting upward
        tPos[i * 3 + 1] += dt * (0.3 + seed[i] * 0.5);
        if (tPos[i * 3 + 1] > top) { tPos[i * 3 + 1] = -top; pos[i * 3 + 1] = -top; }
      }
    }
    const speedMul = mode === 'field' ? 0.35 : mode === 'break' ? 0.8 : 1;
    const damp = Math.exp(-3 * dt);
    for (let i = 0; i < N; i++) {
      const k = i * 3, a = 1 - Math.exp(-spd[i] * speedMul * dt);
      pos[k] += (tPos[k] - pos[k]) * a + vel[k] * dt;
      pos[k + 1] += (tPos[k + 1] - pos[k + 1]) * a + vel[k + 1] * dt;
      pos[k + 2] += (tPos[k + 2] - pos[k + 2]) * a + vel[k + 2] * dt;
      vel[k] *= damp; vel[k + 1] *= damp; vel[k + 2] *= damp;
    }
  }
  const ca = 1 - Math.exp(-2.2 * dt);
  for (let i = 0; i < N * 3; i++) col[i] += (tCol[i] - col[i]) * ca;
  geo.attributes.position.needsUpdate = true;
  geo.attributes.aColor.needsUpdate = true;

  // Heartbeat: double thump ("lub-dub")
  const ph = (t * 1.15) % 1;
  const targetBeat = s.beat ? 1 + 0.07 * Math.exp(-Math.pow((ph - 0.1) * 22, 2)) + 0.045 * Math.exp(-Math.pow((ph - 0.3) * 22, 2)) : 1;
  beat += (targetBeat - beat) * Math.min(1, dt * 20);
  cloud.scale.setScalar(beat);
  cloud.position.y = shapeLift() * (1 - beat); // scale around the lifted centre

  orbit += ((s.orbit ?? 0.5) - orbit) * (1 - Math.exp(-1.5 * dt));
  camera.position.x = Math.sin(t * 0.22) * 7 * orbit;
  camera.position.y = Math.sin(t * 0.15) * 3.5 * orbit;
  camera.lookAt(0, shapeLift() * 0.5, 0);
  stars.rotation.z = t * 0.005;

  mat.uniforms.uTime.value = t; sMat.uniforms.uTime.value = t;
  mat.uniforms.uWobble.value = mode === 'field' ? 0.25 : 0.05;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ controls */
const controls = document.getElementById('controls');
let idleTimer = 0;
function wake() {
  if (!playing) return;
  controls.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => controls.classList.add('idle'), 2500);
}
['pointermove', 'pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, wake));

function restart() { sceneT = 0; applyScene(0); }

document.getElementById('play').addEventListener('click', async () => {
  document.getElementById('intro').classList.add('hide');
  Music.start();
  try { await document.fonts.load('800 220px Poppins'); } catch (_) { /* fall back to system font */ }
  buildShapes();
  playing = true;
  restart();
});
document.getElementById('btn-sound').addEventListener('click', e => { e.currentTarget.textContent = Music.toggle() ? '🔊' : '🔇'; });
document.getElementById('btn-restart').addEventListener('click', () => { Music.start(); restart(); });
document.getElementById('btn-full').addEventListener('click', () => {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen?.();
  else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
});

window.addEventListener('resize', () => { resize(); if (shapes || mode === 'galaxy') applyScene(current, true); });

resize();
applyScene(0, true); // galaxy idles behind the intro screen
frame();
})();
</script>
</body>
